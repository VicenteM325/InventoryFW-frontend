server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Redirige peticiones de la API directamente al contenedor backend.
    # Sin slash final en proxy_pass: nginx reenvía la URI completa tal cual
    # llegó (incluyendo el prefijo /api/), que es lo que el backend espera
    # (sus endpoints están mapeados bajo /api/**, no bajo /**).
    location /api/ {
        proxy_pass http://inventory_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoints de autenticación (/auth/login, /auth/logout, etc.), mapeados
    # en el backend bajo /auth/**, no bajo /api/**.
    location /auth/ {
        proxy_pass http://inventory_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}