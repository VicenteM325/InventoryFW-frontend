server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Redirige peticiones de la API directamente al contenedor backend.
    # Sin slash final en proxy_pass: nginx reenvía la URI completa tal cual
    # llegó (incluyendo el prefijo /api/), que es lo que el backend espera
    # (sus endpoints están mapeados bajo /api/**, no bajo /**).
    location /api/ {
        proxy_pass http://inventory_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoints de autenticación del backend, mapeados bajo /auth/** pero sin
    # prefijo /api/. Se listan uno por uno (en vez de un location /auth/
    # genérico) porque el frontend también usa /auth/sign-in como ruta de
    # página (layouts/auth.jsx); un prefijo genérico le robaría esa ruta al
    # SPA en cualquier carga completa (F5, enlace directo) y el backend
    # respondería 500 al no tener un GET /auth/sign-in mapeado.
    location = /auth/login {
        proxy_pass http://inventory_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /auth/logout {
        proxy_pass http://inventory_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /auth/check-auth {
        proxy_pass http://inventory_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /auth/user/details {
        proxy_pass http://inventory_backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}